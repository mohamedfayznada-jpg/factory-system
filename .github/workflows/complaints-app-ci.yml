name: Complaints PWA CI
on:
  push:
    paths:
      - 'complaints-app/**'
      - '.github/workflows/complaints-app-ci.yml'
  pull_request:
    paths:
      - 'complaints-app/**'
      - '.github/workflows/complaints-app-ci.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: complaints-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: complaints-app/package-lock.json
      - run: npm install
      - run: npm run build
